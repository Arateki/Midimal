<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ─── Tweaks defaults ───────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "weight": 700,
  "weightSmall": 600,
  "sizeScale": 1,
  "smallScale": 1,
  "chromePad": 80,
  "decorGrid": true,       "decorGridIntensity": 1,
  "decorDots": false,      "decorDotsIntensity": 1,
  "decorDiagonals": false, "decorDiagonalsIntensity": 1,
  "decorScanlines": false, "decorScanlinesIntensity": 1,
  "decorCorners": false,   "decorCornersIntensity": 1,
  "decorVignette": false,  "decorVignetteIntensity": 1,
  "decorWatermark": false, "decorWatermarkIntensity": 1,
  "decorParticles": true,  "decorParticlesIntensity": 1,
  "decorGlow": true,       "decorGlowIntensity": 1,
  "accent": false,
  "textColor": ""
}/*EDITMODE-END*/;

// Tema por slot ("mix" = alternar, "light" = tudo branco, "dark" = tudo preto)
function themeFor(tw, index) {
  if (tw.theme === 'light') return 'light';
  if (tw.theme === 'dark') return 'dark';
  // mix: alterna a cada ~2
  return index % 3 === 1 ? 'dark' : 'light';
}

// Hook: cria estado editável para um template, com persistência em memória
function useTemplateData(key) {
  const initial = IG_DEFAULTS[key];
  const [d, setD] = useState(initial);
  const edit = (k) => (v) => setD((s) => ({ ...s, [k]: v }));
  return [d, edit, setD];
}

// Botão de exportar PNG no canto do artboard
function ExportBtn({ targetId, filename, dims, scale = 1 }) {
  const onClick = async (e) => {
    e.stopPropagation();
    const el = document.getElementById(targetId);
    if (!el || !window.htmlToImage) return;
    try {
      // Captura o elemento em sua resolução real
      const inner = el.querySelector('[data-ig-real]');
      const target = inner || el;
      const s = parseInt(scale, 10) || 1;
      
      // Forçamos dimensões físicas multiplicadas no canvas para garantir a nitidez
      const dataUrl = await window.htmlToImage.toPng(target, {
        pixelRatio: s,
        width: dims.w,
        height: dims.h,
        canvasWidth: dims.w * s,
        canvasHeight: dims.h * s,
        style: {
          transform: 'none',
          left: '0',
          top: '0',
          position: 'relative'
        },
        cacheBust: true,
        backgroundColor: getComputedStyle(target).backgroundColor,
      });
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename + (s > 1 ? '@' + s + 'x' : '') + '.png';
      a.click();
    } catch (err) {
      console.error('export failed', err);
    }
  };
  return <button className="ig-export-btn" onClick={onClick} title="Exportar PNG">↓ PNG {scale > 1 ? `(${scale}x)` : ''}</button>;
}

// Wrapper que renderiza template em tamanho real + escala + export
function TplFrame({ id, format, exportScale, children }) {
  const dims = IG_DIMS[format];
  const artboardW = format === 'story' ? 540 : format === 'portrait' ? 720 : 720;
  const scale = artboardW / dims.w;
  const renderedH = dims.h * scale;
  return (
    <div id={id} style={{ position: 'relative', width: artboardW, height: renderedH, background: '#fff' }}>
      <div
        data-ig-real
        className={`ig-canvas ${format === 'story' ? 'ig-size-story' : format === 'portrait' ? 'ig-size-portrait' : 'ig-size-square'}`}
        style={{
          width: dims.w,
          height: dims.h,
          transform: `scale(${scale})`,
          transformOrigin: 'top left',
          position: 'absolute',
          top: 0,
          left: 0,
        }}
      >
        {children}
      </div>
      <ExportBtn targetId={id} filename={id} dims={dims} scale={exportScale} />
    </div>
  );
}

// Interpola dois hexadecimais: t=0 → hex1, t=1 → hex2
function mixHex(hex1, hex2, t) {
  const p = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [r1,g1,b1] = p(hex1), [r2,g2,b2] = p(hex2);
  const r = Math.round(r1*(1-t)+r2*t), g = Math.round(g1*(1-t)+g2*t), b = Math.round(b1*(1-t)+b2*t);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// Conteúdo interno (só o que vai dentro do DCArtboard)
function TplInner({ slotId, tplKey, Tpl, format, theme, weight, weightSmall, sizeScale, smallScale, chromePad, decor, textColor, exportScale }) {
  const [data, edit] = useTemplateData(tplKey);
  // Padding unificado via variável CSS — herdado por todos os elementos de chrome inline
  const pad = 'var(--ig-chrome-pad, 80px)';
  // Seed estável por slot para que as partículas não fiquem idênticas em todos os posts
  const seed = useMemo(() => {
    let s = 0;
    for (let i = 0; i < slotId.length; i++) s = (s * 31 + slotId.charCodeAt(i)) >>> 0;
    return (s % 9973) + 1;
  }, [slotId]);
  const bgColor = theme === 'dark' ? '#000000' : '#ffffff';
  const effectiveColor = textColor || (theme === 'dark' ? '#ffffff' : '#000000');
  // fg-2 e fg-3: interpolam entre a cor do texto e o fundo, preservando hierarquia
  const fg2 = mixHex(effectiveColor, bgColor, 0.38);
  const fg3 = mixHex(effectiveColor, bgColor, 0.58);
  return (
    <TplFrame id={`frame-${slotId}`} format={format} exportScale={exportScale}>
      <div className={theme === 'dark' ? 'inverse' : ''}
        style={{
          position: 'absolute', inset: 0,
          background: bgColor,
          color: effectiveColor,
          '--fg-1': effectiveColor,
          '--fg-2': fg2,
          '--fg-3': fg3,
          '--ig-weight': weight,
          '--ig-weight-light': Math.max(300, weight - 100),
          '--ig-weight-small': weightSmall,
          '--ig-size-scale': sizeScale,
          '--ig-small-scale': smallScale,
          '--ig-chrome-pad': chromePad + 'px',
          boxSizing: 'border-box',
        }}
        data-theme={theme}>
        {/* Decor em bleed — cobre o canvas inteiro, por trás do padding */}
        <IgDecor decor={decor} theme={theme} seed={seed} />
        <div style={{ position: 'relative', zIndex: 1, width: '100%', height: '100%', padding: pad, boxSizing: 'border-box' }}>
          <Tpl data={data} onEdit={edit} format={format} />
        </div>
      </div>
    </TplFrame>
  );
}

// Factory: retorna o JSX do DCArtboard diretamente (necessário pois
// DCSection filtra filhos por type === DCArtboard).
function makeCard({ slotId, label, tplKey, Tpl, format = 'square', theme = 'light', weight, weightSmall, sizeScale, smallScale, chromePad, decor, textColor, exportScale }) {
  const dims = IG_DIMS[format];
  const artboardW = format === 'story' ? 540 : 720;
  const renderedH = dims.h * (artboardW / dims.w);
  return (
    <DCArtboard key={slotId} id={slotId} label={label} width={artboardW} height={renderedH}>
      <TplInner slotId={slotId} tplKey={tplKey} Tpl={Tpl} format={format} theme={theme} weight={weight} weightSmall={weightSmall} sizeScale={sizeScale} smallScale={smallScale} chromePad={chromePad} decor={decor} textColor={textColor} exportScale={exportScale} />
    </DCArtboard>
  );
}

              { value: 500, label: 'Medium' },
              { value: 600, label: 'Semi' },
              { value: 700, label: 'Bold' },
            ]}
            onChange={(v) => setTw('weightSmall', v)}
          />
          <TweakSlider
            label="Tamanho — textos pequenos"
            value={tw.smallScale}
            min={0.7}
            max={1.4}
            step={0.05}
            onChange={(v) => setTw('smallScale', v)}
          />
        </TweakSection>
        <TweakSection label="Layout">
          <TweakSlider
            label="Margem dos cantos"
            value={tw.chromePad}
            min={40}
            max={140}
            step={4}
            unit="px"
            onChange={(v) => setTw('chromePad', v)}
          />
        </TweakSection>
        <TweakSection label="Exportar">
          <TweakRadio
            label="Qualidade do PNG"
            value={tw.exportScale}
            options={[
              { value: 1, label: 'Normal (1x)' },
              { value: 2, label: 'Alta (2x)' },
              { value: 3, label: 'Ultra (3x)' },
            ]}
            onChange={(v) => setTw('exportScale', v)}
          />
          <div style={{ fontSize: 11, lineHeight: 1.5, color: 'rgba(41,38,27,.6)', padding: '4px 0' }}>
            Passe o cursor sobre qualquer post e clique em <strong>↓ PNG</strong> para baixar.
          </div>
        </TweakSection>
        <TweakSection label="Minimalismo">
          <TweakToggle label="Grid"            value={tw.decorGrid}      onChange={(v) => setTw('decorGrid', v)} />
          {tw.decorGrid      && <TweakSlider label="↳ intensidade" value={tw.decorGridIntensity}      min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorGridIntensity', v)} />}
          <TweakToggle label="Grade de pontos" value={tw.decorDots}      onChange={(v) => setTw('decorDots', v)} />
          {tw.decorDots      && <TweakSlider label="↳ intensidade" value={tw.decorDotsIntensity}      min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorDotsIntensity', v)} />}
          <TweakToggle label="Diagonais"       value={tw.decorDiagonals} onChange={(v) => setTw('decorDiagonals', v)} />
          {tw.decorDiagonals && <TweakSlider label="↳ intensidade" value={tw.decorDiagonalsIntensity} min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorDiagonalsIntensity', v)} />}
          <TweakToggle label="Scan lines"      value={tw.decorScanlines} onChange={(v) => setTw('decorScanlines', v)} />
          {tw.decorScanlines && <TweakSlider label="↳ intensidade" value={tw.decorScanlinesIntensity} min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorScanlinesIntensity', v)} />}
          <TweakToggle label="Marcas de canto" value={tw.decorCorners}   onChange={(v) => setTw('decorCorners', v)} />
          {tw.decorCorners   && <TweakSlider label="↳ intensidade" value={tw.decorCornersIntensity}   min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorCornersIntensity', v)} />}
          <TweakToggle label="Vinheta"         value={tw.decorVignette}  onChange={(v) => setTw('decorVignette', v)} />
          {tw.decorVignette  && <TweakSlider label="↳ intensidade" value={tw.decorVignetteIntensity}  min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorVignetteIntensity', v)} />}
          <TweakToggle label="Marca d'água"    value={tw.decorWatermark} onChange={(v) => setTw('decorWatermark', v)} />
          {tw.decorWatermark && <TweakSlider label="↳ intensidade" value={tw.decorWatermarkIntensity} min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorWatermarkIntensity', v)} />}
          <TweakToggle label="Rede neural"     value={tw.decorParticles} onChange={(v) => setTw('decorParticles', v)} />
          {tw.decorParticles && <TweakSlider label="↳ intensidade" value={tw.decorParticlesIntensity} min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorParticlesIntensity', v)} />}
          <TweakToggle label="Glow"            value={tw.decorGlow}      onChange={(v) => setTw('decorGlow', v)} />
          {tw.decorGlow      && <TweakSlider label="↳ intensidade" value={tw.decorGlowIntensity}      min={0.1} max={2} step={0.1} onChange={(v) => setTw('decorGlowIntensity', v)} />}
        </TweakSection>
        <TweakSection label="Exportar">
          <div style={{ fontSize: 11, lineHeight: 1.5, color: 'rgba(41,38,27,.6)', padding: '4px 0' }}>
            Passe o cursor sobre qualquer post e clique em <strong>↓ PNG</strong> (canto superior direito) para baixar em 1080px nativo.
          </div>
        </TweakSection>
        <TweakSection label="Edição inline">
          <div style={{ fontSize: 11, lineHeight: 1.5, color: 'rgba(41,38,27,.6)', padding: '4px 0' }}>
            Todos os textos são editáveis. Clique em qualquer título, parágrafo ou rótulo e digite. <strong>Enter</strong> confirma; <strong>Shift+Enter</strong> quebra linha.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Botão local para abrir o painel de Tweaks (ativo apenas fora do Claude design)
if (window.parent === window) {
  const btn = document.createElement('button');
  btn.textContent = 'Tweaks ↑';
  Object.assign(btn.style, {
    position: 'fixed', bottom: '16px', right: '16px', zIndex: '2147483645',
    padding: '7px 14px', border: 'none', borderRadius: '8px',
    background: 'rgba(41,38,27,.85)', color: '#fff',
    fontSize: '12px', fontFamily: 'ui-sans-serif,system-ui,sans-serif',
    cursor: 'default', backdropFilter: 'blur(12px)',
    boxShadow: '0 2px 8px rgba(0,0,0,.25)',
  });
  btn.onclick = () => window.postMessage({ type: '__activate_edit_mode' }, '*');
  window.addEventListener('message', (e) => {
    if (e.data?.type === '__activate_edit_mode') btn.style.display = 'none';
    if (e.data?.type === '__edit_mode_dismissed') btn.style.display = '';
  });
  document.body.appendChild(btn);
}
</script>
</body>
</html>
